; CPU all-core load throttle (2026-06-24) — mitigates fatal CPU Machine Check
; Exceptions (WHEA 0x124, Bank 4 / "Internal Timer", reported by Processor Core)
; that freeze the rig under sustained UE5 load. Shader compilation was pegging all
; 20 threads of the i9-10900K; capping worker threads cuts the peak package-power
; spike that triggers the MCE. Leaves ~10 of 20 threads free (uses ~10 workers).
; TUNING: if it still freezes, RAISE these (more idle threads = lower power). Once
; the rig is stable (re-tuned BIOS / replaced CPU), LOWER them to claw back compile
; speed. Pairs with %APPDATA%\Unreal Engine\UnrealBuildTool\BuildConfiguration.xml
; (C++ build throttle). See checkpoint 2026-06-24_cpu_mce_freeze_ue5_load_throttle.
[DevOptions.Shaders]
NumUnusedShaderCompilingThreads=10
NumUnusedShaderCompilingThreadsDuringGame=10

